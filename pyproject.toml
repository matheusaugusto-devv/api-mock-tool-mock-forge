[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-forge"
version = "0.1.0"
description = "Dynamic REST API mock server with HTMX workspace and SSE logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mock Forge Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer>=0.12.0",
    "jinja2>=3.1.3",
    "faker>=24.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
mock-forge = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["templates/**/*", "templates/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
