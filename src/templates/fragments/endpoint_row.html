<tr id="endpoint-row-{{ res.id }}">
    <td style="padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle;">
        <strong>{{ res.name }}</strong>
        <div style="margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap;">
            {% for col in res.columns %}
                <span class="badge" style="font-size: 0.75rem; background: var(--surface-hover);">{{ col.name }}: {{ col.type|default('text') }}</span>
            {% endfor %}
        </div>
    </td>
    <td style="padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle;">
        <code>/api/{{ project.slug }}/{{ res.name }}</code>
    </td>
    <td style="padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; vertical-align: middle;">
        <button type="button"
                class="secondary"
                style="padding: 4px 8px; font-size: 0.85em;"
                hx-get="/projects/{{ project.slug }}/endpoints/{{ res.id }}/edit"
                hx-target="#endpoint-row-{{ res.id }}"
                hx-swap="outerHTML">Edit</button>
        <button type="button"
                class="secondary"
                style="padding: 4px 8px; font-size: 0.85em; color: var(--danger-color, #ff4d4f);"
                hx-delete="/projects/{{ project.slug }}/endpoints/{{ res.id }}"
                hx-target="#endpoint-row-{{ res.id }}"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete endpoint '{{ res.name }}'?">Delete</button>
    </td>
</tr>
