<div id="schema-builder-section">
    <div class="card">
        <h3 style="margin-bottom: 12px;">Add Resource / Table</h3>
        <form hx-post="/projects/{{ project.slug }}/resources"
              hx-target="#schema-builder-container"
              hx-swap="innerHTML">
            
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.9em;">Resource Name</label>
                <input type="text" name="name" placeholder="e.g. users, products" required style="width: 100%;" />
            </div>

            <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="font-weight: 500; font-size: 0.9em;">Columns</label>
                    <button type="button"
                            class="secondary"
                            hx-get="/fragments/column-row"
                            hx-target="#columns-container"
                            hx-swap="beforeend"
                            style="font-size: 0.85em; padding: 4px 8px;">+ Add Column</button>
                </div>
                <div id="columns-container">
                    {% include "fragments/column_row.html" %}
                </div>
            </div>

            {% if error %}
                <div class="error" style="margin-bottom: 12px;">{{ error }}</div>
            {% endif %}

            <button type="submit">Create Resource</button>
        </form>
    </div>

    <h3 style="margin-top: 24px; margin-bottom: 12px;">Existing Resources</h3>
    {% include "fragments/resources_list.html" %}
</div>
